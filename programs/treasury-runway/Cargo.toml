[package]
name = "treasury-runway"
version = "0.1.0"
edition = "2021"
description = "Fixed-yield ladder for on-chain treasuries"

[lib]
crate-type = ["cdylib", "lib"]
name = "treasury_runway"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[dev-dependencies]
mollusk-svm = "0.15.0"
mollusk-svm-programs-token = "0.15.0"
# The majors deliberately match those mollusk is built on, not the ones
# anchor pulls in: the conversion between them lives in one place in the tests.
solana-account = "4"
solana-pubkey = "4"
solana-instruction = "3"
solana-program-error = "3"
# Reading fixtures/vectors.json in tests — its only purpose.
serde_json = "1"
# Assembling a transaction message in the size-limit test: counting bytes
# with a formula of our own would test our arithmetic, not the network limit.
solana-message = { version = "4", features = ["wincode"] }

[package]
name = "treasury-runway"
version = "0.1.0"
edition = "2021"
description = "Fixed-yield ladder for on-chain treasuries"

[lib]
crate-type = ["cdylib", "lib"]
name = "treasury_runway"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[dev-dependencies]
mollusk-svm = "0.15.0"

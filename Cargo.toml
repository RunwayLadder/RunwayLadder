[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
# Release builds drop overflow checks by default. Here a silent wrap is not a
# panic but a wrong payout on a treasurer's screen, so they stay on.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

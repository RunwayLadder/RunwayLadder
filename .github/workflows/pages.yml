# One Pages site, two folders in one artifact:
#
#   https://runwayladder.github.io/RunwayLadder/       the landing page (apps/landing, static)
#   https://runwayladder.github.io/RunwayLadder/app/   the treasurer dashboard (apps/web)
#
# The dashboard published here is the prototype on mock data — VITE_RPC_URL is not set, and
# the status bar says so itself. Network mode on Pages arrives once the program is
# deployed to devnet (T049): the VITE_* variables will then come from repository vars.
# The app has no router (screens are state), so no 404.html copy is needed under /app/.
#
# Rust is not needed: the IDL lives in packages/sdk/src/idl and is bundled with web.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A second push must not overtake the first: deployments run in order, not in parallel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # takes the version from package.json → packageManager

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @runway-ladder/web exec vite build
        env:
          # A project site lives under /<repo>/; the app takes /app/ below it, the landing the root.
          PAGES_BASE: /${{ github.event.repository.name }}/app/

      # The landing has no build step: it is copied as is.
      - run: |
          mkdir -p dist
          cp -r apps/landing/. dist/
          cp -r apps/web/dist dist/app

      # Pages is enabled once by the repository owner: Settings → Pages → Source:
      # "GitHub Actions". GITHUB_TOKEN cannot create the site itself (the first
      # run failed with "Resource not accessible by integration"), so the step
      # only reads the existing configuration.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
